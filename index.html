<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NodeJs Practice Area</title>

    <!-- Browser Tab Icon -->
    <link
      rel="icon"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg"
      type="image/svg+xml"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #222;
        color: #fafafa;
      }

      .container {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .node-icon {
        width: 60px;
        height: 60px;
      }

      h1 {
        font-size: 32px;
      }

      h1::selection {
        background-color: #339933;
        color: #ffffff;
      }

      img {
        user-select: none;
      }

    </style>
  </head>

  <body>
    <div class="container">
      <!-- Body Icon -->
      <img
        src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg"
        alt="Node.js Icon"
        class="node-icon"
      />

      <h1>NodeJs Practice Area</h1>
    </div>
  </body>
</html>
